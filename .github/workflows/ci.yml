name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deterministic-partitions:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        part: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install Linux deterministic test tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep strace
      - name: Install macOS deterministic test tools
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: Install Windows deterministic test tools
        if: runner.os == 'Windows'
        run: choco install ripgrep --no-progress -y
      - name: Validate plugin, marketplace, and Click/Fix skills
        if: runner.os == 'Linux' && matrix.part == 1
        run: python scripts/validate_distribution.py
      - name: Compile Python sources
        if: runner.os == 'Linux' && matrix.part == 1
        run: python -m compileall -q hooks evals scripts benchmarks tests
      - name: Check whitespace errors
        if: runner.os == 'Linux' && matrix.part == 1
        run: git diff --check
      - name: Run deterministic Hook, grader, and repository-policy tests
        run: python -B scripts/run_ci_tests.py --parts 4 --part ${{ matrix.part }} --timings-out "${{ runner.temp }}/click-test-durations.json"
      - name: Keep measured test durations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-durations-${{ matrix.os }}-${{ matrix.part }}
          path: ${{ runner.temp }}/click-test-durations.json
          if-no-files-found: warn
      - name: Run privileged macOS fs_usage smoke
        if: runner.os == 'macOS' && matrix.part == 1
        run: sudo -n env PYTHONDONTWRITEBYTECODE=1 "${pythonLocation}/bin/python" -B -m unittest tests.test_click_observer_macos.MacOSNativeSmokeTests -v
      - name: Run native Windows ETW smoke
        if: runner.os == 'Windows' && matrix.part == 1
        run: python -B -m unittest tests.test_click_observer_windows.WindowsNativeSmokeTests -v

  # Retain the established required-check names after splitting execution.
  deterministic-tests:
    if: always()
    needs: deterministic-partitions
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require every test partition and native smoke to succeed
        shell: bash
        env:
          PARTITION_RESULT: ${{ needs.deterministic-partitions.result }}
        run: test "$PARTITION_RESULT" = success

  native-authoritative:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.3"
      - name: Create isolated native-observer Python
        run: python -m venv --without-pip "${{ runner.temp }}/click-native-authority"
      - name: Install Linux authoritative observer prerequisite
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y strace
      - name: Run authoritative Linux contract
        if: runner.os == 'Linux'
        shell: bash
        run: |
          "$RUNNER_TEMP/click-native-authority/bin/python" -B \
            -m hooks.click_observer_runtime prepare --project "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/click-native-authority/bin/python" -B -m unittest \
            tests.test_click_authoritative_reuse.AuthoritativeObserverRuntimeTests \
            tests.test_click_authoritative_reuse.AuthoritativeCrossContractReuseTests -v
      - name: Verify non-privileged macOS preparation is unavailable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          "$RUNNER_TEMP/click-native-authority/bin/python" -B \
            -m hooks.click_observer_runtime prepare --project "$GITHUB_WORKSPACE"
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "expected unavailable status 2, received $status" >&2
            exit 1
          fi
      - name: Run authoritative macOS contract
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo -n git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo -n env PYTHONDONTWRITEBYTECODE=1 \
            "$RUNNER_TEMP/click-native-authority/bin/python" -B \
            -m hooks.click_observer_runtime prepare --project "$GITHUB_WORKSPACE"
          sudo -n env PYTHONDONTWRITEBYTECODE=1 \
            "$RUNNER_TEMP/click-native-authority/bin/python" -B -m unittest \
            tests.test_click_authoritative_reuse.AuthoritativeObserverRuntimeTests \
            tests.test_click_authoritative_reuse.AuthoritativeCrossContractReuseTests -v
      - name: Run authoritative Windows contract
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_INSTALL=%%I"
          if not defined VS_INSTALL exit /b 1
          call "%VS_INSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64
          "%RUNNER_TEMP%\click-native-authority\Scripts\python.exe" -B -m hooks.click_observer_runtime prepare --project "%GITHUB_WORKSPACE%"
          "%RUNNER_TEMP%\click-native-authority\Scripts\python.exe" -B -m unittest tests.test_click_authoritative_reuse.AuthoritativeObserverRuntimeTests tests.test_click_authoritative_reuse.AuthoritativeCrossContractReuseTests -v

  python-runtime-compatibility:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run collector, proposal, setup, and bootstrap compatibility
        run: |
          python -VV
          python -m unittest \
            tests.test_click_collector_runtime \
            tests.test_click_auto_sharding \
            tests.test_click_shard_proposal \
            tests.test_click_sharding_setup.ShardingControlParsingTests \
            tests.test_click_sharding_setup.ShardingSetupStateMachineTests \
            tests.test_click_sharding_setup.ShardingGateIntegrationTests.test_evidence_mode_runs_setup_through_baseline_without_guarded_contract \
            tests.test_click_authoritative_observer.PortableObserverRuntimeContractTests \
            tests.test_click_gate_inspection.ClickGateInspectionTests.test_sanitized_path_fails_closed_on_a_symlink_loop \
            tests.test_click_gate_inspection.ClickGateInspectionTests.test_sanitized_path_fails_closed_on_a_broken_symlink \
            tests.test_click_gate_inspection.ClickGateInspectionTests.test_sanitized_path_drops_a_missing_absolute_entry \
            -v

  pytest-integration:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned pytest integration dependency
        run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Run real pytest collection and proposal integration
        run: python -m unittest tests.test_click_auto_sharding tests.test_click_shard_proposal -v

  vitest-sharding-integration:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/fixtures/vitest-v5/package-lock.json
      - name: Provision the pinned Vitest fixture
        working-directory: tests/fixtures/vitest-v5
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run Vitest inventory, proposal, and parent-fallback integration
        run: >-
          python -B -m unittest
          tests.test_click_auto_sharding.RealCollectionTests.test_vitest_collection_is_repeatable_and_exact_file_selectors_are_safe
          tests.test_click_shard_proposal.ProposalTests.test_vitest_same_basenames_generate_exact_file_children
          tests.test_click_evidence_shards.ClickEvidenceShardsTests.test_vitest_new_file_and_ambiguous_command_fall_back_to_parent
          tests.test_click_sharding_setup.VitestShardingSetupTests
          tests.test_click_multilang_execution.MultilangExecutionHookTests.test_vitest_no_install_runner_executes_and_reuses_exact_identity
          -v

  jest-sharding-integration:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/fixtures/jest-v30/package-lock.json
      - name: Provision the pinned Jest fixture
        working-directory: tests/fixtures/jest-v30
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run Jest inventory, proposal, fallback, setup, and Gate integration
        run: >-
          python -B -m unittest
          tests.test_click_auto_sharding.CommandParsingTests.test_jest_parser_rejects_network_mutating_dynamic_and_ambiguous_shapes
          tests.test_click_auto_sharding.RealCollectionTests.test_jest_file_inventory_is_repeatable_and_run_by_path_is_exact
          tests.test_click_shard_proposal.ProposalTests.test_jest_children_use_exact_run_tests_by_path_selectors
          tests.test_click_evidence_shards.ClickEvidenceShardsTests.test_jest_new_file_and_ambiguous_options_fall_back_to_parent
          tests.test_click_sharding_setup.JestShardingSetupTests
          tests.test_click_multilang_execution.MultilangExecutionHookTests.test_jest_no_install_runner_executes_and_reuses_exact_identity
          -v

  multilang-execution:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Require provisioned Node, npm, npx, and Go runtimes
        shell: bash
        run: |
          node --version
          npm --version
          npx --version
          go version
      - name: Run runtime identity and real Hook-to-runner fixtures
        env:
          GOTOOLCHAIN: local
          GOPROXY: "off"
        run: >-
          python -B -m unittest
          tests.test_click_runtime_identity
          tests.test_click_multilang_execution -v

  mixed-project-integration:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/fixtures/mixed-project/package-lock.json
      - name: Provision the pinned mixed fixture
        working-directory: tests/fixtures/mixed-project
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Require the local Go toolchain
        run: go version
      - name: Run mixed-project partial verification
        env:
          GOTOOLCHAIN: local
          GOPROXY: "off"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest tests.test_click_mixed_project -v

  native-toolchain-profile-smoke:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Require native verification toolchains
        shell: bash
        run: |
          cargo --version
          gradle --version
          dotnet --info
          cmake --version
          ctest --version
      - name: Install pinned TypeScript compiler
        run: npm install --global --ignore-scripts --no-audit --no-fund typescript@5.9.3
      - name: Run TypeScript no-emit fixture
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/click-typescript"
          printf '{"compilerOptions":{"strict":true,"noEmit":true},"files":["index.ts"]}\n' > "$RUNNER_TEMP/click-typescript/tsconfig.json"
          printf 'const value: number = 4; void value;\n' > "$RUNNER_TEMP/click-typescript/index.ts"
          tsc --noEmit -p "$RUNNER_TEMP/click-typescript/tsconfig.json"
      - name: Run offline Rust fixture
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/click-rust/src"
          printf '[package]\nname="click_fixture"\nversion="0.1.0"\nedition="2021"\n' > "$RUNNER_TEMP/click-rust/Cargo.toml"
          printf '#[cfg(test)] mod tests { #[test] fn adds() { assert_eq!(2 + 2, 4); } }\n' > "$RUNNER_TEMP/click-rust/src/lib.rs"
          cargo test --offline --manifest-path "$RUNNER_TEMP/click-rust/Cargo.toml"
      - name: Run offline Gradle fixture
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/click-gradle"
          printf "tasks.register('test') { doLast { assert 2 + 2 == 4 } }\n" > "$RUNNER_TEMP/click-gradle/build.gradle"
          gradle -p "$RUNNER_TEMP/click-gradle" test --offline --no-daemon
      - name: Run no-restore .NET fixture
        shell: bash
        run: |
          dotnet new classlib --no-restore --output "$RUNNER_TEMP/click-dotnet"
          dotnet restore "$RUNNER_TEMP/click-dotnet" --ignore-failed-sources
          dotnet test "$RUNNER_TEMP/click-dotnet" --no-restore
      - name: Run CMake and CTest fixture
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/click-cmake"
          printf 'cmake_minimum_required(VERSION 3.16)\nproject(click_fixture NONE)\nenable_testing()\nadd_test(NAME pass COMMAND "${CMAKE_COMMAND}" -E true)\n' > "$RUNNER_TEMP/click-cmake/CMakeLists.txt"
          cmake -S "$RUNNER_TEMP/click-cmake" -B "$RUNNER_TEMP/click-cmake/build"
          ctest --test-dir "$RUNNER_TEMP/click-cmake/build" --output-on-failure
      - name: Run profile and runtime identity regressions
        run: >-
          python -B -m unittest
          tests.test_click_verification_adapters
          tests.test_click_runtime_identity -v

  content-validation-profile-smoke:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install bounded content tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq libxml2-utils imagemagick
      - name: Require and exercise direct read-only tools
        shell: bash
        run: |
          printf '{"ok":true}\n' > "$RUNNER_TEMP/click.json"
          printf '<root/>\n' > "$RUNNER_TEMP/click.xml"
          printf '<svg xmlns="http://www.w3.org/2000/svg" width="1" height="1"/>\n' > "$RUNNER_TEMP/click.svg"
          jq empty "$RUNNER_TEMP/click.json"
          xmllint --noout --nonet "$RUNNER_TEMP/click.xml"
          identify -ping "$RUNNER_TEMP/click.svg"
      - name: Run content adapter Hook-to-runner fixtures
        run: python -B -m unittest tests.test_click_content_validation -v
