name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deterministic-partitions:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        part: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install Linux deterministic test tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep strace
      - name: Install macOS deterministic test tools
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: Install Windows deterministic test tools
        if: runner.os == 'Windows'
        run: choco install ripgrep --no-progress -y
      - name: Validate plugin, marketplace, and Click/Fix skills
        if: runner.os == 'Linux' && matrix.part == 1
        run: python scripts/validate_distribution.py
      - name: Compile Python sources
        if: runner.os == 'Linux' && matrix.part == 1
        run: python -m compileall -q hooks evals scripts benchmarks tests
      - name: Check whitespace errors
        if: runner.os == 'Linux' && matrix.part == 1
        run: git diff --check
      - name: Run deterministic Hook, grader, and repository-policy tests
        run: python -B scripts/run_ci_tests.py --parts 4 --part ${{ matrix.part }} --timings-out "${{ runner.temp }}/click-test-durations.json"
      - name: Keep measured test durations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-durations-${{ matrix.os }}-${{ matrix.part }}
          path: ${{ runner.temp }}/click-test-durations.json
          if-no-files-found: warn
      - name: Run privileged macOS fs_usage smoke
        if: runner.os == 'macOS' && matrix.part == 1
        run: sudo -n env PYTHONDONTWRITEBYTECODE=1 "${pythonLocation}/bin/python" -B -m unittest tests.test_click_observer_macos.MacOSNativeSmokeTests -v
      - name: Run native Windows ETW smoke
        if: runner.os == 'Windows' && matrix.part == 1
        run: python -B -m unittest tests.test_click_observer_windows.WindowsNativeSmokeTests -v

  # Retain the established required-check names after splitting execution.
  deterministic-tests:
    if: always()
    needs: deterministic-partitions
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Require every test partition and native smoke to succeed
        shell: bash
        env:
          PARTITION_RESULT: ${{ needs.deterministic-partitions.result }}
        run: test "$PARTITION_RESULT" = success

  native-authoritative:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.3"
      - name: Create isolated native-observer Python
        run: python -m venv --without-pip "${{ runner.temp }}/click-native-authority"
      - name: Verify non-privileged macOS preparation is unavailable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          "$RUNNER_TEMP/click-native-authority/bin/python" -B \
            -m hooks.click_observer_runtime prepare --project "$GITHUB_WORKSPACE"
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "expected unavailable status 2, received $status" >&2
            exit 1
          fi
      - name: Run authoritative macOS contract
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo -n git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo -n env PYTHONDONTWRITEBYTECODE=1 \
            "$RUNNER_TEMP/click-native-authority/bin/python" -B \
            -m hooks.click_observer_runtime prepare --project "$GITHUB_WORKSPACE"
          sudo -n env PYTHONDONTWRITEBYTECODE=1 \
            "$RUNNER_TEMP/click-native-authority/bin/python" -B -m unittest \
            tests.test_click_authoritative_reuse.AuthoritativeObserverRuntimeTests \
            tests.test_click_authoritative_reuse.AuthoritativeCrossContractReuseTests -v
      - name: Run authoritative Windows contract
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_INSTALL=%%I"
          if not defined VS_INSTALL exit /b 1
          call "%VS_INSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64
          "%RUNNER_TEMP%\click-native-authority\Scripts\python.exe" -B -m hooks.click_observer_runtime prepare --project "%GITHUB_WORKSPACE%"
          "%RUNNER_TEMP%\click-native-authority\Scripts\python.exe" -B -m unittest tests.test_click_authoritative_reuse.AuthoritativeObserverRuntimeTests tests.test_click_authoritative_reuse.AuthoritativeCrossContractReuseTests -v

  python-runtime-compatibility:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run collector, proposal, setup, and bootstrap compatibility
        run: |
          python -VV
          python -m unittest \
            tests.test_click_collector_runtime \
            tests.test_click_auto_sharding \
            tests.test_click_shard_proposal \
            tests.test_click_sharding_setup.ShardingControlParsingTests \
            tests.test_click_sharding_setup.ShardingSetupStateMachineTests \
            tests.test_click_sharding_setup.ShardingGateIntegrationTests.test_evidence_mode_runs_setup_through_baseline_without_guarded_contract \
            tests.test_click_authoritative_observer.PortableObserverRuntimeContractTests \
            -v

  pytest-integration:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned pytest integration dependency
        run: python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Run real pytest collection and proposal integration
        run: python -m unittest tests.test_click_auto_sharding tests.test_click_shard_proposal -v
